[test]
# The action-log temp path first (no test writes the real log), then happy-dom
# (browser globals), then text-measure's exact HarfBuzz backend,
# so every test measures text the way the Bun/Node hosts do.
preload = ["./action-log-preload.ts", "./happydom.ts", "./text-measure-preload.ts"]
# Restrict discovery to this repo's own packages — tools/docs-framework is a
# submodule carrying vendored package snapshots whose tests are not ours to run.
root = "packages"
